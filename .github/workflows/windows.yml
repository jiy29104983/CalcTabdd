name: Windows plugin build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'project\(CalcTabdd VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag must match the project version' }
          if (-not (Test-Path "docs/releases/v$version.md")) { throw 'Formal release notes are required' }
      - name: Check out pinned host test dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cxasm/notepad--
          ref: 91105f68b74382128f3313ac5af8accdc77de918
          path: build/host
          persist-credentials: false
      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          host: windows
          target: desktop
          cache: true
      - name: Configure Release plugin and native integration tests
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 -T v142 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON `
            "-DCALCTABDD_HOST_SOURCE_DIR=$PWD/build/host" 2>&1 | Tee-Object -FilePath build/configure.log
          if ($LASTEXITCODE -ne 0) {
            $errorText = (Get-Content -Raw build/configure.log) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=CMake configure::$errorText"
            exit 1
          }
      - name: Build Release DLL and tests
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel 4 2>&1 | Tee-Object -FilePath build/compile.log
          if ($LASTEXITCODE -ne 0) {
            $errors = (Select-String -Path build/compile.log -Pattern 'error|fatal' | Select-Object -Last 25 | ForEach-Object { $_.Line }) -join "`n"
            $errors = $errors -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Windows compilation::$errors"
            exit 1
          }
      - name: Test engine, UI, ABI and dynamic DLL with native QScintilla
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR/bin;$env:PATH"
          $env:CALCTABDD_SCREENSHOT_DIR = "$PWD/build/screenshots"
          ctest --test-dir build/windows -C Release --verbose --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $logs = Get-ChildItem build/windows/*_tests.txt
          if ($logs.Count -ne 3) { throw "Expected three complete test suites" }
          foreach ($log in $logs) {
            $content = Get-Content -Raw $log
            if ($content -notmatch 'Totals: \d+ passed, 0 failed, 0 skipped') {
              throw "Incomplete, failed or skipped tests in $($log.Name)"
            }
          }
      - name: Test Debug UI with Qt assertions enabled
        shell: pwsh
        run: |
          cmake --build build/windows --config Debug --target page_tests --parallel 4 2>&1 | Tee-Object -FilePath build/compile-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:QT_ROOT_DIR/bin;$env:PATH"
          $env:QT_QPA_FONTDIR = "$env:SystemRoot/Fonts"
          & ./build/windows/Debug/page_tests.exe -platform offscreen -o "build/windows/page_tests-debug.txt,txt" -o "-,txt"
          $testExitCode = $LASTEXITCODE
          Select-String -Path build/windows/page_tests-debug.txt -Pattern 'FAIL!|QFATAL|ASSERT|Totals:' -Context 2,3
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ((Get-Content -Raw build/windows/page_tests-debug.txt) -notmatch 'Totals: \d+ passed, 0 failed, 0 skipped') {
            throw 'Debug UI regression did not complete successfully'
          }
      - name: Package and verify Windows build
        id: package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-diagnostics-${{ github.run_id }}
          path: |
            build/configure.log
            build/compile.log
            build/compile-debug.log
            build/windows/page_tests-debug.txt
            build/windows/*_tests.txt
            build/windows/Testing/Temporary/*.log
            build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Upload installable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish requested release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: dist
      - name: Verify downloaded package
        run: python3 scripts/verify-package.py dist/*.zip --commit "$GITHUB_SHA"
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$tag" == "v${VERSION}" ]]
          notes="docs/releases/v${VERSION}.md"
          test -s "$notes"
          cp "$notes" build-release-notes.md
          printf '\n源码提交：`%s`\n\n[Windows 编译与测试记录](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> build-release-notes.md
          gh release create "$tag" dist/*.zip dist/*.sha256 --verify-tag --target "$GITHUB_SHA" --draft \
            --title "CalcTabdd v${VERSION}" --notes-file build-release-notes.md
          gh release edit "$tag" --draft=false --prerelease=false --latest
